name: Verify Apple notarization credentials

# Level-1 check: hits Apple's notary service with the SAME credentials the
# release uses, WITHOUT building anything. This is the exact request that
# returned "403 A required agreement is missing or has expired" — if the
# updated Program License Agreement has been accepted, `notarytool history`
# now succeeds instead of 403-ing.
#
# Run: Actions -> "Verify Apple notarization credentials" -> Run workflow.

on:
  workflow_dispatch: {}

jobs:
  verify-notary:
    name: notarytool history probe
    runs-on: macos-14
    timeout-minutes: 10
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Probe notary service
        shell: bash
        run: |
          set -uo pipefail

          # Prefer the App Store Connect API key (release.yml's primary path);
          # fall back to Apple ID + app-specific password.
          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "Auth: App Store Connect API key (key-id=$APPLE_API_KEY)"
            set +e
            OUT=$(xcrun notarytool history --key "$KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" 2>&1)
            RC=$?
            set -e
            rm -f "$KEY_PATH"
          elif [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Auth: Apple ID ($APPLE_ID, team=$APPLE_TEAM_ID)"
            set +e
            OUT=$(xcrun notarytool history --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" 2>&1)
            RC=$?
            set -e
          else
            echo "::error::No notarization credentials found. Set APPLE_API_KEY_ID + APPLE_API_ISSUER + APPLE_API_KEY_CONTENT, or APPLE_ID + APPLE_PASSWORD + APPLE_TEAM_ID."
            exit 1
          fi

          echo "── notarytool output ──"
          echo "$OUT"
          echo "── exit code: $RC ──"

          if echo "$OUT" | grep -qiE "agreement is missing or has expired|required agreement"; then
            echo "::error::PLA gate still CLOSED — the required agreement is missing/expired. Accept the updated Program License Agreement in the developer portal for this team, then re-run."
            exit 1
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::error::notarytool failed (rc=$RC) for a reason other than the agreement gate — inspect the output above (bad creds / network / permissions)."
            exit 1
          fi

          echo "✅ Notary service accepted the credentials — the agreement gate is CLEARED. Notarized releases (notarize=true) should now succeed."
